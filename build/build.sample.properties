;; =============================================================================
;; Grafida — private build configuration (SAMPLE)
;; =============================================================================
;;
;; Copy this file to build/build.properties and fill in your own values:
;;
;;     cp build/build.sample.properties build/build.properties
;;
;; build/build.properties is gitignored — it holds secrets and is NEVER
;; committed. build.xml loads it automatically; a missing file is tolerated, so
;; targets that don't need these properties keep working without it.
;;
;; This is the plumbing for publishing a release to GitHub Releases and then
;; uploading the update information to our CDN (the update mechanism itself is
;; not built yet — these properties are the prerequisite).

; ------------------------------------------------------------------------------
; GitHub Releases
; ------------------------------------------------------------------------------
; The GitHub organisation or user the repository lives under, e.g. "grafida"
github.organization=grafida
; The GitHub repository name, e.g. "grafida"
github.repository=grafida
; A GitHub Personal Access Token (PAT) with permission to create releases on the
; repository. Generate one at https://github.com/settings/tokens
github.token=yourGitHubTokenHere

; ------------------------------------------------------------------------------
; CDN upload (FTP) — where the update information is published
; ------------------------------------------------------------------------------
; FTP hostname of the CDN storage, e.g. storage.bunnycdn.com
cdn.ftp.hostname=storage.example.com
; FTP username for the CDN storage
cdn.ftp.username=myusername
; FTP password for the CDN storage
cdn.ftp.password=mypassword
; Directory on the CDN storage where the update information is uploaded
cdn.ftp.directory=/grafida/updates

; ------------------------------------------------------------------------------
; macOS code signing & notarisation — see build/readme/01-macos-signing.md
; ------------------------------------------------------------------------------
; Leave both blank for local dev builds (the app is ad-hoc signed and runs
; locally, but cannot be notarised/distributed). Fill them in to sign + notarise
; the distributable .app/.dmg during 'phing package' / release.
;
; The "Developer ID Application" signing identity, exactly as shown by
;   security find-identity -v -p codesigning
; e.g. Developer ID Application: Your Name (ABCDE12345)
macos.sign.identity=
; The notarytool keychain profile name created with
;   xcrun notarytool store-credentials "grafida-notary" --apple-id … --team-id … --password …
; When set (and macos.sign.identity is set), the DMG is submitted to Apple and
; the notarisation ticket is stapled.
macos.notary.profile=

; ------------------------------------------------------------------------------
; Windows code signing (Azure Artifact Signing + Jsign) — see
; build/readme/04-exe-signing-on-macos.md
; ------------------------------------------------------------------------------
; Leave windows.sign.op-item blank for local dev builds — grafida.exe and the
; installer are shipped unsigned. Fill it in to sign both during
; 'phing package-win-x86' / 'phing package' / release. Signing NEVER runs for
; 'phing git-win-x86' (the plain compile) — only from packaging — because
; Azure's Basic tier is capped at 5,000 signatures/month and this must not be
; burned by local development builds.
;
; The name of the 1Password item holding the Azure service principal created in
; build/readme/04-exe-signing-on-macos.md (appId/password/tenant). Blank disables signing.
windows.sign.op-item=
; The field names inside that 1Password item (only change these if your item
; uses different field names than the defaults below).
windows.sign.op-field-appid=appId
windows.sign.op-field-password=password
windows.sign.op-field-tenant=tenant
; Jsign --keystore / --alias — the Azure Artifact Signing account + certificate
; profile created in build/readme/04-exe-signing-on-macos.md.
windows.sign.keystore=weu.codesigning.azure.net
windows.sign.alias=akeeba-signing/AkeebaPublic
; RFC3161 timestamp authority — do not remove; without it the signature expires
; with the 3-day Azure Artifact Signing certificate.
windows.sign.tsaurl=http://timestamp.acs.microsoft.com

; ------------------------------------------------------------------------------
; Documentation publishing (SFTP) — see build/readme/05-documentation-publishing.md
; ------------------------------------------------------------------------------
; Where scripts/upload-docs.sh (`composer docs:publish`) sends docs/ — the Help
; pages, docs/images/ and _manifest.json — to be served as the Documentation
; section of Grafida.app. Publishing the documentation is INDEPENDENT of making
; a release and is deliberately not one of its steps.
;
; The host is a `Host` alias out of ~/.ssh/config, which is where the identity,
; and anything else the connection needs, is configured. There is deliberately
; NO key setting and NO password setting: the key lives in 1Password and is
; reached through its SSH agent, which raises its own biometric prompt for every
; connection. A key path here would route around that.
docs.sftp.host=sftp.example.com
; The target directory. It must already exist; the script does not create it.
docs.sftp.path=/home/username/public_html/media/com_docs/books/desktop
; The account to connect as. Only needed when ~/.ssh/config sets no `User` for
; the host — with neither, ssh connects as your LOCAL login name, which on
; shared hosting is never the right account.
docs.sftp.user=
; Overrides the `Port` set for that host in ~/.ssh/config, which itself defaults
; to 22. Normally left blank.
docs.sftp.port=
